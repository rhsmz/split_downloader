name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: split_downloader-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: split_downloader-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: split_downloader-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: split_downloader-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/split_downloader ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          copy target\${{ matrix.target }}\release\split_downloader.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SplitDownloader ${{ github.ref_name }}
          body: |
            ## SplitDownloader ${{ github.ref_name }}

            High-performance multi-connection split downloader with GUI.

            ### Features
            - Multi-connection HTTP Range downloads
            - Resume / checkpoint
            - Hash verification (SHA-256 / MD5 / xxHash)
            - Rate limiting, proxies, mirrors
            - Priority queue, clipboard monitoring
            - System notifications

            ### Downloads
            Choose the binary for your platform from the assets below.
            On Linux/macOS, make it executable: `chmod +x split_downloader-*`

            **Requirements**: Rust 1.80+ for building from source.
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
