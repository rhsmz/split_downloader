[package]
name = "split_downloader"
version = "1.0.0"
edition = "2021"
description = "High-performance multi-connection split downloader with GUI, resume, hash verification, and advanced features"
authors = ["Grok"]
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks", "gzip", "brotli", "deflate", "cookies"] }
eframe = { version = "0.29", default-features = true }
egui = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
md-5 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
hex = "0.4"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
bytes = "1"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
url = "2"
once_cell = "1"
dashmap = "6"
governor = "0.6"
nonzero_ext = "0.3"
notify-rust = "4"
arboard = "3"
clap = { version = "4", features = ["derive"] }
humansize = "2"
indicatif = "0.17"
sysinfo = "0.32"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
